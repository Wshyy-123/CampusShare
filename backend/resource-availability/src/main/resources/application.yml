server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campusshare-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusshare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jackson:
    time-zone: Asia/Shanghai

logging:
  level:
    org.hibernate.SQL: warn
