server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CAMPUSSHARE_SESSION
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: campus-share-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_share?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
