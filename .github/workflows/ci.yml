name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7.26
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campusshare_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare UTF-8 test database
        env:
          MYSQL_PWD: root
        run: docker exec -e MYSQL_PWD ${{ job.services.mysql.id }} mysql --user=root --execute="ALTER DATABASE campusshare_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: Backend tests on MySQL 5.7.26
        working-directory: campus-share-backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify \
            -Dspring.datasource.url="jdbc:mysql://127.0.0.1:3306/campusshare_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true" \
            -Dspring.datasource.username=root \
            -Dspring.datasource.password=root \
            -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - name: Verify MySQL 5.7 exports and historical migrations
        env:
          MYSQL_PWD: root
          MYSQL_COMMAND_JSON: '["docker", "exec", "-i", "-e", "MYSQL_PWD", "${{ job.services.mysql.id }}", "mysql", "--user=root"]'
        run: python3 scripts/mysql57/verify_exports.py --prefix campusshare_ci --report export-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql57-verification
          path: |
            export-verification.json
            campus-share-backend/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run check:baseline
          npm run check:api
          npm run build
