spring:
  datasource:
    url: jdbc:h2:mem:campusshare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ROLE,USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

campusshare:
  seat-no-show:
    enabled: false
  sports-no-show:
    enabled: false
  legacy-checkin:
    enabled: false
