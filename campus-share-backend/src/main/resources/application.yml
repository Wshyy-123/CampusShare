server:
  port: ${CAMPUSSHARE_PORT:8080}
  error:
    include-message: never

spring:
  datasource:
    url: ${CAMPUSSHARE_DB_URL:jdbc:mysql://localhost:3306/campusshare?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${CAMPUSSHARE_DB_USERNAME:root}
    password: ${CAMPUSSHARE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

campusshare:
  seat-no-show:
    # XIA-11：主应用启动即补查积压；仅处理座位成功起30分钟未到。
    enabled: ${CAMPUSSHARE_SEAT_NO_SHOW_ENABLED:true}
    scan-delay-ms: ${CAMPUSSHARE_SEAT_NO_SHOW_DELAY_MS:30000}
  venue-lifecycle:
    enabled: ${CAMPUSSHARE_VENUE_LIFECYCLE_ENABLED:true}
    scan-delay-ms: ${CAMPUSSHARE_VENUE_LIFECYCLE_DELAY_MS:10000}
  legacy-checkin:
    # 原 XIA-9/10 的 /api/v1/library 演示入口仍信任请求 userId，默认关闭。
    enabled: false

app:
  sports:
    # 可签到窗口：[start - early, start + grace)，单位分钟；口径见 docs/api/sports-attendance.yaml
    check-in-early-minutes: ${CAMPUSSHARE_SPORTS_CHECKIN_EARLY_MINUTES:0}
    check-in-grace-minutes: ${CAMPUSSHARE_SPORTS_CHECKIN_GRACE_MINUTES:15}
    no-show-cron: ${CAMPUSSHARE_SPORTS_NO_SHOW_CRON:0/10 * * * * ?}
