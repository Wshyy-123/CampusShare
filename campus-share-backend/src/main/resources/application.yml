server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campusshare?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 20050122BABA  # 👈 这里改成你 MySQL 的 root 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis 配置（解决刚才那个黄色警告）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    # 登录（XIA-1）落地前的临时调试身份，默认关闭；本地联调用 dev profile 打开
    dev-identity-enabled: false
  sports:
    # 可签到窗口：[start - early, start + grace)，单位分钟；口径见 docs/api/sports-attendance.yaml
    check-in-early-minutes: 0
    check-in-grace-minutes: 15
    # 体育未到扫描间隔，10 秒一次便于演示
    no-show-cron: "0/10 * * * * ?"